<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Sederhana</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pixelify+Sans&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Toko Serba Ada</h1>
        <p>Selamat datang di toko kami!</p>
    </header>

    <div class="container">
        <section class="produk">
            <h2>Daftar Produk Kami</h2>
            <div id="daftar-produk" class="grid-produk"></div>
        </section>

        <section class="keranjang">
            <h2>Keranjang Belanja Anda</h2>
            <ul id="daftar-keranjang"></ul>

            <div class="harga">
                <p>Total Item  : <span id="total-item">0</span></p>
                <p>Total Harga : Rp <span id="total-harga">0</span></p>
            </div>

            <div class="action">
                <button id="batal-terakhir" onclick="batalItemTerakhir()">Batal Item Terakhir</button>
                <button id="batal-semua" onclick="batalSemuaItem()">Batal Semua Item</button>
                <button id="checkout" onclick="checkout()">Checkout</button>
            </div>

            <div id="ringkasan-pesanan"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
